apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: emart-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: emart.rules
      rules:
        - alert: EmartPodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace="emartapp"}[15m]) > 3
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "{{ $labels.pod }} is restarting repeatedly"

        - alert: EmartPodNotReady
          expr: kube_pod_status_ready{namespace="emartapp", condition="false"} == 1
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.pod }} not ready for 5 minutes"

        - alert: EmartImagePullFailure
          expr: kube_pod_container_status_waiting_reason{namespace="emartapp", reason=~"ImagePullBackOff|ErrImagePull"} == 1
          for: 3m
          labels: { severity: critical }
          annotations:
            summary: "{{ $labels.pod }} cannot pull its image (check Nexus registry / pull secret)"

        - alert: EmartDeploymentReplicasMismatch
          expr: kube_deployment_status_replicas_available{namespace="emartapp"} < kube_deployment_spec_replicas{namespace="emartapp"}
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.deployment }} has fewer available replicas than desired"

        - alert: EmartHighCPU
          expr: |
            sum by (pod) (rate(container_cpu_usage_seconds_total{namespace="emartapp", container!=""}[5m]))
            / sum by (pod) (kube_pod_container_resource_limits{namespace="emartapp", resource="cpu"}) > 0.85
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.pod }} above 85% of CPU limit"

        - alert: EmartHighMemory
          expr: |
            sum by (pod) (container_memory_working_set_bytes{namespace="emartapp", container!=""})
            / sum by (pod) (kube_pod_container_resource_limits{namespace="emartapp", resource="memory"}) > 0.85
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.pod }} above 85% of memory limit"

        - alert: EmartMetricsTargetDown
          expr: up{namespace="emartapp"} == 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Prometheus cannot scrape {{ $labels.job }} / {{ $labels.pod }}"
---
# ---------------------------------------------------------------------------
# 2. SERVICEMONITORS  (only produce data once the apps expose /metrics, see notes)
#    Empty selector = every Service in "emartapp"; targetPort picks the right one,
#    so you don't need to know the Service labels or port names in kkartchart.
# ---------------------------------------------------------------------------
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: emart-javaapi
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: [emartapp]
  selector: {}
  endpoints:
    - targetPort: 9000
      path: /actuator/prometheus      # Spring Boot + Micrometer
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: emart-nodeapi
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: [emartapp]
  selector: {}
  endpoints:
    - targetPort: 5000
      path: /metrics                  # prom-client
      interval: 15s
---
# ---------------------------------------------------------------------------
# 3. GRAFANA DASHBOARD (auto-imported by the Grafana sidecar)
#    Top 5 panels work now. Bottom 3 fill in after the apps expose metrics.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: emart-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  emart.json: |
    {
      "title": "Emart (emartapp namespace)",
      "uid": "emart-overview",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        { "id": 1, "type": "stat", "title": "Available replicas",
          "gridPos": { "h": 5, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "kube_deployment_status_replicas_available{namespace=\"emartapp\"}", "legendFormat": "{{deployment}}" }] },
        { "id": 2, "type": "timeseries", "title": "CPU by pod",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"emartapp\", container!=\"\"}[5m]))", "legendFormat": "{{pod}}" }] },
        { "id": 3, "type": "timeseries", "title": "Memory by pod",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [{ "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"emartapp\", container!=\"\"})", "legendFormat": "{{pod}}" }] },
        { "id": 4, "type": "timeseries", "title": "Restarts (15m)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"emartapp\"}[15m]))", "legendFormat": "{{pod}}" }] },
        { "id": 5, "type": "timeseries", "title": "Network in (B/s)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "Bps" } },
          "targets": [{ "expr": "sum by (pod) (rate(container_network_receive_bytes_total{namespace=\"emartapp\"}[5m]))", "legendFormat": "{{pod}}" }] },
        { "id": 6, "type": "timeseries", "title": "Java API: request rate",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 21 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum by (status) (rate(http_server_requests_seconds_count{namespace=\"emartapp\"}[5m]))", "legendFormat": "{{status}}" }] },
        { "id": 7, "type": "timeseries", "title": "Java API: heap used",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 21 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [{ "expr": "sum by (pod) (jvm_memory_used_bytes{namespace=\"emartapp\", area=\"heap\"})", "legendFormat": "{{pod}}" }] },
        { "id": 8, "type": "timeseries", "title": "Node API: event loop lag (s)",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 21 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "nodejs_eventloop_lag_seconds{namespace=\"emartapp\"}", "legendFormat": "{{pod}}" }] }
      ]
    }
